logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\powershell.exe'
  selection_args:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -ec '
  filter_legit_admin:
    User|startswith: 'NT AUTHORITY\SYSTEM'
  condition: selection_image and selection_args and not filter_legit_admin
falsepositives:
  - Legitimate administrator scripts that base64-encode multi-line PowerShell
  - Some software installers (note examples here)
level: high
